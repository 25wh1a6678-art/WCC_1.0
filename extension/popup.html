<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Contract Guard</title>
    <style>
      body { width: 320px; margin: 0; padding: 16px; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      h2 { margin: 0 0 12px; font-size: 18px; }
      .toggle { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .toggle input { width: 18px; height: 18px; }
      textarea { width: 100%; min-height: 110px; border-radius: 12px; border: 1px solid #cbd5e1; padding: 10px; resize: vertical; }
      button { margin-top: 12px; width: 100%; border: none; border-radius: 10px; background: #4f46e5; color: white; padding: 10px 12px; font-weight: 700; cursor: pointer; }
      .status { margin-top: 10px; font-size: 12px; color: #334155; }
    </style>
  </head>
  <body>
    <h2>Focus Guard</h2>
    <label class="toggle">
      <span>Guard enabled</span>
      <input id="guard-enabled" type="checkbox" />
    </label>
    <textarea id="domains" placeholder="youtube.com
instagram.com
reddit.com"></textarea>
    <button id="save">Save blocking list</button>
    <div id="status" class="status">Ready.</div>
    <script src="popup.js"></script>
  </body>
</html>
